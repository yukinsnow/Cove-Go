name: Build OpenClaw Go iOS
on:
  workflow_dispatch:
  push:
    branches: [openclaw]
    paths: ['app/**', 'packages/openclaw_client/**', 'tooling/build-openclaw-ipa.sh', 'tooling/openclaw_icon.swift', '.github/workflows/build-openclaw-ios.yml']
permissions:
  contents: read
jobs:
  build:
    # Explicit Intel host avoids the capacity-constrained default ARM pool.
    # Xcode still cross-compiles the iPhone arm64 binary.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      # connectivity_plus uses Network APIs introduced in the iOS 26 SDK.
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: bash tooling/build-openclaw-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Go-0.1.13-build14-${{ github.sha }}-unsigned
          path: |
            build/openclaw/*0.1.13-build14*-unsigned.ipa
            build/openclaw/*0.1.13-build14*-unsigned.ipa.sha256
          if-no-files-found: error
